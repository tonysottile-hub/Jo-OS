name: Render Unmapped America Video
on:
  push:
    paths:
      - 'render-requests/*.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: Render request path
        required: true
        default: render-requests/example.json
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select request
        id: req
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST="${{ inputs.request_path }}"
          else
            REQUEST="$(python3 - <<'PY'
          import json, os
          e=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          hc=e.get("head_commit") or {}
          files=(hc.get("added") or [])+(hc.get("modified") or [])
          print(next((x for x in files if x.startswith("render-requests/") and x.endswith(".json")), ""))
          PY
          )"
          fi
          echo "Selected request: $REQUEST"
          test -n "$REQUEST"
          test -f "$REQUEST"
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"
          python3 - "$REQUEST" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text())
          for k in ("manifest_path","output_name"):
              if not d.get(k): raise SystemExit(f"missing {k}")
          if d.get("publish_authorized") is not False:
              raise SystemExit("proof renderer requires publish_authorized=false")
          print("request validated")
          PY
      - name: Verify FFmpeg
        run: ffmpeg -version && ffprobe -version
      - name: Render
        shell: bash
        run: |
          MANIFEST="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["manifest_path"])' "${{ steps.req.outputs.path }}")"
          OUTPUT="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["output_name"])' "${{ steps.req.outputs.path }}")"
          python3 renderer/render.py --manifest "$MANIFEST" --output "output/$OUTPUT"
      - name: Verify output
        run: test -n "$(find output -name '*.mp4' -size +0c -print -quit)" && ffprobe -v error output/*.mp4
      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: unmapped-render
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
