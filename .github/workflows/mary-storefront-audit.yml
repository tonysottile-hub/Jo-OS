name: Mary independent storefront audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'browser/**'
      - '.github/workflows/mary-storefront-audit.yml'
  schedule:
    - cron: '29 */3 * * *'
permissions:
  contents: read
concurrency:
  group: mary-independent-storefront-audit
  cancel-in-progress: false
jobs:
  mary-storefront-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JO_AUDIT_WORKER: mary
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix browser
      - run: npx --prefix browser playwright install --with-deps chromium
      - run: node --test browser/policy.test.cjs
      - run: node browser/audit.cjs
      - name: Independently verify Mary storefront
        run: python3 browser/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mary-storefront-evidence
          path: browser-output/
          retention-days: 7
          if-no-files-found: error
