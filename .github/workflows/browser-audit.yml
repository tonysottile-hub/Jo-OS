name: Jo constrained public web audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'browser/**'
      - '.github/workflows/browser-audit.yml'
permissions:
  contents: read
concurrency:
  group: jo-public-browser-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix browser
      - run: npx --prefix browser playwright install --with-deps chromium
      - run: node --test browser/policy.test.cjs
      - run: node browser/audit.cjs
      - name: Independently verify public pages
        run: python3 browser/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jo-public-browser-evidence
          path: browser-output/
          retention-days: 7
          if-no-files-found: error
