name: Test Commons Media Feed
on:
  push:
    paths:
      - 'orchestration/media-requests/*.json'
      - 'media-requests/*.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'media-requests JSON path'
        required: true
        type: string
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select request
        id: req
        shell: bash
        env:
          DISPATCH_REQUEST: ${{ inputs.request_path }}
        run: |
          if [ -n "$DISPATCH_REQUEST" ]; then
            REQUEST="$DISPATCH_REQUEST"
          else
            REQUEST="$(git diff --name-only HEAD^ HEAD -- 'orchestration/media-requests/*.json' 'media-requests/*.json' | head -1)"
          fi
          test -n "$REQUEST"
          test -f "$REQUEST"
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"
          python - "$REQUEST" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          d=json.load(open(sys.argv[1]))
          queries=d.get("queries") or [d["query"]]
          print("queries_json="+json.dumps(queries,separators=(",",":")))
          print("count="+str(d.get("count",6)))
          print("required_place="+str(d.get("required_place","")))
          print("category="+str(d.get("category","")))
          print("file_titles_json="+json.dumps(d.get("file_titles",[]),separators=(",",":")))
          print("required_terms_json="+json.dumps(d.get("required_terms",[]),separators=(",",":")))
          print("exclude_terms_json="+json.dumps(d.get("exclude_terms",[]),separators=(",",":")))
          print("explicit_only="+("true" if d.get("explicit_only",False) else "false"))
          print("source_pdf_url="+str(d.get("source_pdf_url","")))
          print("source_pdf_pages_json="+json.dumps(d.get("source_pdf_pages",[]),separators=(",",":")))
          print("source_pdf_credit="+str(d.get("source_pdf_credit","")))
          print("source_image_urls_json="+json.dumps(d.get("source_image_urls",[]),separators=(",",":")))
          print("source_image_credits_json="+json.dumps(d.get("source_image_credits",[]),separators=(",",":")))
          print("source_image_titles_json="+json.dumps(d.get("source_image_titles",[]),separators=(",",":")))
          print("source_image_licenses_json="+json.dumps(d.get("source_image_licenses",[]),separators=(",",":")))
          print("source_image_attribution_url="+str(d.get("source_image_attribution_url","")))
          PY
      - name: Source media
        env:
          REQUEST_PATH: ${{ steps.req.outputs.path }}
        run: |
          mkdir -p output/media
          export SOURCE_PDF_URL="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("source_pdf_url",""))' "$REQUEST_PATH")"
          export SOURCE_PDF_CREDIT="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("source_pdf_credit",""))' "$REQUEST_PATH")"
          if [ -n "$SOURCE_PDF_URL" ]; then
            mkdir -p output/pdf-pages
            python - <<'PY'
          import os,urllib.request
          req=urllib.request.Request(os.environ["SOURCE_PDF_URL"],headers={"User-Agent":"Jo-OS-UnmappedAmerica/1.0"})
          with urllib.request.urlopen(req,timeout=90) as r:
              open("output/source.pdf","wb").write(r.read())
          PY
            if ! command -v pdftoppm >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; fi
            if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
            pdftoppm -jpeg -r 180 output/source.pdf output/pdf-pages/page
            python - <<'PY'
          import json,os,pathlib,shutil,subprocess
          pages=json.loads(r'''${{ steps.req.outputs.source_pdf_pages_json }}''')
          if not pages: pages=[1,2,3]
          url=os.environ["SOURCE_PDF_URL"]
          credit=os.environ.get("SOURCE_PDF_CREDIT") or "National Park Service, NRHP nomination photographs"
          assets=[]; sources=[]; seen={}
          for i,page in enumerate(pages,1):
              src=pathlib.Path(f"output/pdf-pages/page-{int(page):02d}.jpg")
              if not src.exists(): src=pathlib.Path(f"output/pdf-pages/page-{int(page)}.jpg")
              if not src.exists(): raise SystemExit(f"Missing rendered PDF page {page}")
              dest=pathlib.Path(f"output/media/nps-{i:02d}.jpg")
              seen[page]=seen.get(page,0)+1
              variant=seen[page]
              if variant==1:
                  shutil.copyfile(src,dest)
                  variant_name="full frame"
              else:
                  probe=subprocess.check_output(["ffprobe","-v","error","-select_streams","v:0","-show_entries","stream=width,height","-of","csv=p=0",str(src)],text=True).strip()
                  w,h=map(int,probe.split(","))
                  side=min(w,h)
                  x=0 if variant==2 else w-side
                  y=0 if variant==2 else h-side
                  subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),"-vf",f"crop={side}:{side}:{x}:{y}","-q:v","2",str(dest)],check=True)
                  variant_name="top-left detail crop" if variant==2 else "bottom-right detail crop"
              assets.append({"path":str(dest),"duration":8.0})
              sources.append({"title":f"Tybo Charcoal Kilns — NRHP nomination photograph page {page}, {variant_name}","source_url":url,"license":"Official NPS archival record; source attributed","artist":"Donald W. Jarvis (1973)","credit":credit,"local_path":str(dest),"matched_query":"official_nps_pdf"})
          pathlib.Path("output/manifest.json").write_text(json.dumps({"assets":assets,"duration_per_asset":8.0,"required_place":"Tybo","required_terms":["Tybo"],"exclude_terms":[],"media_sources":sources},indent=2)+"\n")
          print(json.dumps({"source":"official_nps_pdf","downloaded":len(assets),"manifest":"output/manifest.json"},indent=2))
          PY
          elif [ "$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("source_image_urls",[])))' "$REQUEST_PATH")" -gt 0 ]; then
            if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
            python - <<'PY'
          import json,os,pathlib,shutil,subprocess,time,urllib.error,urllib.request
          d=json.load(open(os.environ["REQUEST_PATH"]))
          urls=d["source_image_urls"]
          credits=d.get("source_image_credits",[])
          titles=d.get("source_image_titles",[])
          licenses=d.get("source_image_licenses",[])
          attribution=d.get("source_image_attribution_url","")
          required_place=d.get("required_place","")
          required_terms=d.get("required_terms",[])
          exclude_terms=d.get("exclude_terms",[])
          assets=[]; sources=[]; seen={}; cache={}
          for i,url in enumerate(urls,1):
              src=pathlib.Path(f"output/source-{i:02d}.jpg")
              if url in cache:
                  shutil.copyfile(cache[url],src)
              else:
                  req=urllib.request.Request(url,headers={"User-Agent":"Jo-OS-UnmappedAmerica/1.0","Accept":"image/*"})
                  downloaded=False
                  for attempt in range(4):
                      try:
                          with urllib.request.urlopen(req,timeout=90) as r: src.write_bytes(r.read())
                          cache[url]=src
                          downloaded=True
                          break
                      except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                          code=getattr(exc,"code",None)
                          if code in (429,500,502,503,504) and attempt < 3:
                              time.sleep(2 ** attempt)
                              continue
                          print(f"warning: skipping unavailable media URL {url}: {exc}")
                          break
                  if not downloaded:
                      continue
              seen[url]=seen.get(url,0)+1
              variant=seen[url]
              dest=pathlib.Path(f"output/media/direct-{i:02d}.jpg")
              if variant==1:
                  shutil.copyfile(src,dest); variant_name="full frame"
              else:
                  probe=subprocess.check_output(["ffprobe","-v","error","-select_streams","v:0","-show_entries","stream=width,height","-of","csv=p=0",str(src)],text=True).strip()
                  w,h=map(int,probe.split(","))
                  side=min(w,h)
                  x=0 if variant==2 else w-side
                  y=0 if variant==2 else h-side
                  subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),"-vf",f"crop={side}:{side}:{x}:{y}","-q:v","2",str(dest)],check=True)
                  variant_name="top-left detail crop" if variant==2 else "bottom-right detail crop"
              title=titles[i-1] if i-1<len(titles) else f"{required_place} archival image {i}"
              credit=credits[i-1] if i-1<len(credits) else "Source attribution in request"
              license_name=licenses[i-1] if i-1<len(licenses) else "License specified by source"
              assets.append({"path":str(dest),"duration":8.0})
              sources.append({"title":f"{title} — {variant_name}","source_url":url,"attribution_url":attribution,"license":license_name,"credit":credit,"local_path":str(dest),"matched_query":"vetted_direct_image"})
          pathlib.Path("output/manifest.json").write_text(json.dumps({"assets":assets,"duration_per_asset":8.0,"required_place":required_place,"required_terms":required_terms,"exclude_terms":exclude_terms,"media_sources":sources},indent=2)+"\n")
          print(json.dumps({"source":"vetted_direct_images","downloaded":len(assets),"manifest":"output/manifest.json"},indent=2))
          PY
          else
            mapfile -t QUERIES < <(python - <<'PY'
          import json
          for q in json.loads(r'''${{ steps.req.outputs.queries_json }}'''): print(q)
          PY
            )
            ARGS=()
            for q in "${QUERIES[@]}"; do ARGS+=(--query "$q"); done
            PLACE="${{ steps.req.outputs.required_place }}"
            CATEGORY="${{ steps.req.outputs.category }}"
            if [ -n "$PLACE" ]; then ARGS+=(--place "$PLACE"); fi
            if [ -n "$CATEGORY" ]; then ARGS+=(--category "$CATEGORY"); fi
            mapfile -t FILE_TITLES < <(python - <<'PY'
          import json
          for x in json.loads(r'''${{ steps.req.outputs.file_titles_json }}'''): print(x)
          PY
            )
            for t in "${FILE_TITLES[@]}"; do ARGS+=(--file-title "$t"); done
            mapfile -t REQUIRED_TERMS < <(python - <<'PY'
          import json
          for x in json.loads(r'''${{ steps.req.outputs.required_terms_json }}'''): print(x)
          PY
            )
            for t in "${REQUIRED_TERMS[@]}"; do ARGS+=(--required-term "$t"); done
            mapfile -t EXCLUDE_TERMS < <(python - <<'PY'
          import json
          for x in json.loads(r'''${{ steps.req.outputs.exclude_terms_json }}'''): print(x)
          PY
            )
            for t in "${EXCLUDE_TERMS[@]}"; do ARGS+=(--exclude-term "$t"); done
            if [ "${{ steps.req.outputs.explicit_only }}" = "true" ]; then ARGS+=(--explicit-only); fi
            python renderer/commons_media.py "${ARGS[@]}" --out-dir output/media --manifest output/manifest.json --count "${{ steps.req.outputs.count }}"
          fi
      - name: Verify manifest
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.load(open("output/manifest.json"))
          assert len(m["assets"]) >= 3
          assert len(m["media_sources"]) == len(m["assets"])
          for x in m["assets"]: assert pathlib.Path(x["path"]).stat().st_size > 0
          print("verified",len(m["assets"]),"media assets","for",m.get("required_place"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commons-media
          path: output/
          retention-days: 7
